name: Auto Post to Threads

on:
  schedule:
    # 매일 한국 시간 기준 오전 9시 (UTC 00:00) 에 자동 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # 깃허브 웹 콘솔에서 'Run workflow' 버튼으로 수동 즉시 실행 가능

permissions:
  contents: write # 큐 파일 업데이트 후 Git 커밋 & 푸시 권한

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Bun 런타임 환경 설정
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 의존성 패키지 설치
        run: bun install

      - name: 대기 중인 스레드 자동 포스팅 실행
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
        run: bun run post

      - name: 큐 상태 업데이트 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/queue.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update threads queue status [skip ci]" && git push)
